<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI安全资源军火库 — 洺熙</title>
<style>
:root {
  --bg: #f6f8fb;
  --bg-soft: #eef3f8;
  --panel: #ffffff;
  --panel-strong: #f8fafc;
  --ink: #0f172a;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --navy: #0f172a;
  --shadow: 0 18px 45px rgba(15, 23, 42, .10);
  --shadow-soft: 0 10px 28px rgba(15, 23, 42, .08);
  --m1: #8b5cf6;
  --m2: #06b6d4;
  --m3: #ef4444;
  --m4: #f59e0b;
  --m5: #10b981;
  --m6: #3b82f6;
  --danger: #dc2626;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  display: flex;
  background:
    radial-gradient(circle at top left, rgba(139, 92, 246, .14), transparent 32rem),
    radial-gradient(circle at 85% 0%, rgba(6, 182, 212, .12), transparent 26rem),
    linear-gradient(180deg, #fbfdff 0%, var(--bg) 48%, #eef2f7 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: none; }
button, input, select { font: inherit; }

aside {
  width: 300px;
  min-width: 300px;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  padding: 20px 16px;
  background: rgba(255, 255, 255, .86);
  border-right: 1px solid rgba(203, 213, 225, .72);
  backdrop-filter: blur(22px);
  z-index: 20;
}
.aside-header {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 4px 18px;
  border-bottom: 1px solid var(--line);
}
.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #fff;
  background: linear-gradient(135deg, var(--navy), #334155 52%, var(--m1));
  box-shadow: var(--shadow-soft);
  font-size: 22px;
}
.aside-header h2 { font-size: 16px; letter-spacing: .2px; color: var(--ink); }
.aside-header p { margin-top: 2px; font-size: 12px; color: var(--muted); }
.aside-meter {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 16px 0 14px;
}
.aside-meter div {
  padding: 12px;
  border-radius: 16px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(15, 23, 42, .04);
}
.aside-meter strong { display: block; font-size: 20px; line-height: 1; }
.aside-meter span { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
.nav-caption {
  margin: 8px 4px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--muted-2);
  text-transform: uppercase;
}
.nav-section { margin-bottom: 8px; }
.nav-section-title {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border: 1px solid transparent;
  border-left: 4px solid var(--module-color, var(--navy));
  border-radius: 14px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all .18s ease;
  text-align: left;
}
.nav-section-title:hover,
.nav-section-title.active {
  background: #fff;
  border-color: var(--line);
  border-left-color: var(--module-color, var(--navy));
  box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
}
.nav-section-title .label { display: flex; align-items: center; gap: 9px; min-width: 0; }
.nav-section-title .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--module-color, var(--navy));
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--module-color, var(--navy)) 14%, transparent);
  flex: 0 0 auto;
}
.nav-section-title b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-section-title .count {
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--module-color, var(--navy)) 12%, #fff);
  color: var(--module-color, var(--navy));
  font-size: 11px;
  font-weight: 700;
}
.nav-categories { display: none; padding: 6px 0 2px 18px; }
.nav-categories.open { display: block; }
.nav-cat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 2px 0;
  padding: 7px 10px 7px 16px;
  border-radius: 12px;
  border-left: 2px solid transparent;
  color: var(--muted);
  font-size: 12px;
  transition: all .16s ease;
}
.nav-cat:hover,
.nav-cat.active {
  color: var(--ink);
  background: #fff;
  border-left-color: var(--module-color, var(--navy));
  box-shadow: 0 6px 18px rgba(15, 23, 42, .05);
}
.nav-cat em { font-style: normal; font-size: 11px; color: var(--muted-2); }
.mod-M1 { --module-color: var(--m1); }
.mod-M2 { --module-color: var(--m2); }
.mod-M3 { --module-color: var(--m3); }
.mod-M4 { --module-color: var(--m4); }
.mod-M5 { --module-color: var(--m5); }
.mod-M6 { --module-color: var(--m6); }

main { flex: 1; min-width: 0; }
.header {
  position: sticky;
  top: 0;
  z-index: 15;
  padding: 20px 28px 18px;
  background: rgba(246, 248, 251, .88);
  border-bottom: 1px solid rgba(203, 213, 225, .72);
  backdrop-filter: blur(20px);
}
.hero {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: flex-end;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, .06);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.header h1 {
  font-size: clamp(26px, 3vw, 42px);
  letter-spacing: -1.2px;
  line-height: 1.1;
  color: var(--ink);
}
.header .subtitle {
  max-width: 860px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 14px;
}
.hero-note {
  min-width: 220px;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--navy);
  color: #fff;
  box-shadow: var(--shadow-soft);
}
.hero-note span { display: block; color: #cbd5e1; font-size: 12px; }
.hero-note strong { display: block; margin-top: 4px; font-size: 18px; }
.toolbar {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(130px, 170px)) auto;
  gap: 10px;
  margin-top: 18px;
}
.search-field,
.select-field,
.reset-btn {
  height: 42px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: rgba(255, 255, 255, .92);
  color: var(--ink);
  box-shadow: 0 8px 20px rgba(15, 23, 42, .04);
}
.search-field {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
}
.search-field span { color: var(--muted-2); }
.search-field input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
}
.search-field input::placeholder { color: var(--muted-2); }
.select-field { padding: 0 12px; outline: 0; cursor: pointer; }
.search-field:focus-within,
.select-field:focus { border-color: #60a5fa; box-shadow: 0 0 0 4px rgba(96, 165, 250, .16); }
.reset-btn {
  padding: 0 16px;
  cursor: pointer;
  font-weight: 700;
  color: var(--muted);
  transition: all .16s ease;
}
.reset-btn:hover { color: var(--ink); border-color: var(--ink); }

.content { padding: 26px 28px 48px; }
.dashboard { margin-bottom: 28px; }
.overview-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.kpi-card {
  position: relative;
  overflow: hidden;
  padding: 18px;
  min-height: 126px;
  border-radius: var(--radius-lg);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-soft);
}
.kpi-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: var(--accent, var(--navy));
}
.kpi-value { font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -1px; color: var(--ink); }
.kpi-label { margin-top: 10px; color: var(--muted); font-weight: 700; font-size: 13px; }
.kpi-desc { margin-top: 4px; color: var(--muted-2); font-size: 12px; }
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(360px, 1.3fr) minmax(320px, .7fr);
  gap: 16px;
}
.panel {
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .92);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.panel-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #fff, #f8fafc);
}
.panel-header h2 { font-size: 16px; }
.panel-header p { margin-top: 2px; color: var(--muted); font-size: 12px; }
.module-distribution, .importance-distribution { padding: 8px 18px 18px; }
.dist-row {
  display: grid;
  grid-template-columns: 148px 58px 54px 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #edf2f7;
  font-size: 13px;
}
.dist-row:last-child { border-bottom: 0; }
.dist-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; }
.dist-name .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--module-color, var(--navy)); }
.dist-name span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dist-count, .dist-rate { color: var(--muted); text-align: right; }
.bar-track {
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: #edf2f7;
}
.bar-fill {
  width: var(--pct, 0%);
  height: 100%;
  border-radius: inherit;
  background: var(--module-color, var(--navy));
}
.importance-row {
  grid-template-columns: 74px 58px 60px 1fr;
}
.importance-row .dist-name { color: var(--grade-color); }
.legend-note {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  background: #fbfdff;
}

.section { margin-bottom: 30px; scroll-margin-top: 174px; }
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 12px;
  padding: 18px;
  border-radius: var(--radius-lg);
  background: linear-gradient(90deg, color-mix(in srgb, var(--module-color) 14%, #fff), #fff 62%);
  border: 1px solid var(--line);
  border-left: 6px solid var(--module-color);
  box-shadow: 0 10px 24px rgba(15, 23, 42, .05);
}
.section-kicker { color: var(--module-color); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.section-title { margin-top: 3px; font-size: 22px; letter-spacing: -.4px; }
.section-desc { margin-top: 5px; max-width: 840px; color: var(--muted); font-size: 13px; }
.section-count {
  flex: 0 0 auto;
  padding: 10px 14px;
  border-radius: 14px;
  text-align: center;
  background: #fff;
  border: 1px solid color-mix(in srgb, var(--module-color) 18%, var(--line));
  color: var(--module-color);
  font-weight: 800;
}
.section-count span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: rgba(255,255,255,.82);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .16s ease;
  user-select: none;
}
.tag:hover, .tag.active {
  border-color: var(--module-color);
  color: var(--module-color);
  background: color-mix(in srgb, var(--module-color) 10%, #fff);
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 214px;
  padding: 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .94);
  box-shadow: 0 8px 22px rgba(15, 23, 42, .05);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--module-color), color-mix(in srgb, var(--module-color) 35%, #fff));
}
.card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--module-color) 38%, var(--line));
  box-shadow: var(--shadow);
}
.card-header { display: flex; gap: 12px; align-items: flex-start; }
.seq-badge {
  flex: 0 0 auto;
  min-width: 42px;
  padding: 5px 7px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--module-color) 12%, #fff);
  color: var(--module-color);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}
.card-title-wrap { min-width: 0; }
.card-title {
  display: inline;
  color: var(--ink);
  font-size: 15px;
  font-weight: 800;
  line-height: 1.35;
  word-break: break-word;
}
.card-title:hover { color: var(--module-color); }
.card-title .icon { margin-right: 6px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 10px; }
.badge,
.category-pill {
  display: inline-flex;
  align-items: center;
  min-height: 23px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  border: 1px solid transparent;
}
.badge-S { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
.badge-A { background: #fff7ed; color: #d97706; border-color: #fed7aa; }
.badge-B { background: #ecfdf5; color: #059669; border-color: #bbf7d0; }
.badge-C { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
.badge-D { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
.badge-github { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
.badge-paper { background: #f5f3ff; color: #7c3aed; border-color: #ddd6fe; }
.badge-video { background: #fdf2f8; color: #db2777; border-color: #fbcfe8; }
.badge-guide { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge-blog { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge-course { background: #ecfdf5; color: #047857; border-color: #bbf7d0; }
.badge-community { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
.badge-competition { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge-conference { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
.category-pill { background: #fff; color: var(--muted); border-color: var(--line); }
.card-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 12px; }
.card-stats span { display: inline-flex; align-items: center; gap: 4px; }
.card-desc {
  margin-top: 12px;
  color: #475569;
  font-size: 13px;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: auto;
  padding-top: 14px;
  color: var(--muted-2);
  font-size: 12px;
}
.domain { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.card-link {
  flex: 0 0 auto;
  padding: 7px 10px;
  border-radius: 10px;
  color: #fff;
  background: var(--module-color);
  font-weight: 800;
}
.card-link:hover { filter: brightness(.94); }
.no-results {
  text-align: center;
  padding: 64px 20px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, .72);
  color: var(--muted);
  font-size: 14px;
}
.back-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: var(--navy);
  color: #fff;
  box-shadow: var(--shadow);
  cursor: pointer;
  z-index: 40;
  transition: transform .16s ease, filter .16s ease;
}
.back-top:hover { transform: translateY(-2px); filter: brightness(1.08); }

@media (max-width: 1180px) {
  aside { width: 264px; min-width: 264px; }
  .toolbar { grid-template-columns: 1fr 1fr 1fr; }
  .search-field { grid-column: 1 / -1; }
  .overview-grid { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
  .dashboard-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  body { display: block; }
  aside { display: none; }
  .header { padding: 18px 16px; }
  .hero { display: block; }
  .hero-note { margin-top: 14px; }
  .toolbar { grid-template-columns: 1fr; }
  .content { padding: 18px 14px 40px; }
  .overview-grid { grid-template-columns: 1fr; }
  .section-head { display: block; }
  .section-count { margin-top: 12px; display: inline-block; }
  .cards { grid-template-columns: 1fr; }
  .dist-row { grid-template-columns: 116px 46px 48px 1fr; gap: 8px; }
}
</style>
</head>
<body>
<aside>
  <div class="aside-header">
    <div class="brand-mark">🛡️</div>
    <div>
      <h2>AI安全资源军火库</h2>
      <p>v0.1 · 洺熙 · 米斯特AI安全社区</p>
    </div>
  </div>
  <div class="aside-meter">
    <div><strong id="side-total">0</strong><span>资源总数</span></div>
    <div><strong id="side-modules">6</strong><span>安全模块</span></div>
  </div>
  <div class="nav-caption">Module Navigation</div>
  <div id="nav-sections"></div>
</aside>
<main>
  <header class="header">
    <div class="hero">
      <div class="hero-copy">
        <div class="eyebrow">AI Security Arsenal</div>
        <h1>AI安全资源军火库 — 洺熙</h1>
        <div class="subtitle">基于 AI安全六大模块分类体系｜建议作为数据站使用｜来源互联网项目源整理。以参考表的仪表盘与分级配色重构导航体验。</div>
        <div class="subtitle">公众号：RTAi-Lab 制作</div>
      </div>
      <div class="hero-note">
        <span>参考工作簿更新时间</span>
        <strong>2026-05-07</strong>
      </div>
    </div>
    <div class="toolbar" aria-label="资源筛选工具栏">
      <label class="search-field" for="search"><span>🔍</span><input type="search" id="search" placeholder="搜索名称、描述、分类、类型或 URL..." oninput="handleSearch(this.value)"></label>
      <select id="importance-filter" class="select-field" onchange="setImportanceFilter(this.value)" aria-label="按重要性筛选"></select>
      <select id="type-filter" class="select-field" onchange="setTypeFilter(this.value)" aria-label="按资源类型筛选"></select>
      <select id="sort-mode" class="select-field" onchange="setSortMode(this.value)" aria-label="排序方式">
        <option value="priority">优先级排序</option>
        <option value="stars">Stars 降序</option>
        <option value="seq">原始序号</option>
        <option value="name">名称 A-Z</option>
      </select>
      <button class="reset-btn" type="button" onclick="resetFilters()">重置</button>
    </div>
  </header>
  <div class="content">
    <section class="dashboard" id="dashboard" aria-label="数据概览仪表盘"></section>
    <div id="content"></div>
  </div>
</main>

<script>

测和屏蔽敏感信息，充当文本数据的隐私防火墙。它由 NLP 和模式识别提供支持，确保 AI 系统、聊天平台和数字环境中的零数据泄漏。 专为安全 AI 的未来而打造。", "url": "https://github.com/Hemanth-Mardi/Privacy-Armor"}, {"seq": 254, "name": "lakshman199/Aviation-MRO-Local-AI-Assistant-Offline-RAG-Pipeline-", "type": "GitHub仓库", "importance": "D", "stars": "", "forks": "", "category": "AI信息泄漏", "desc": "用于航空维护 (MRO) 的安全、100% 离线 RAG 管道。使用本地 LLM（通过 Ollama 的 Phi-3）和 ChromaDB 搜索 FAA 技术手册。为机械师提供即时、准确的程序答案，同时确保零数据泄漏并严格遵守航空航天隐私标准。", "url": "https://github.com/lakshman199/Aviation-MRO-Local-AI-Assistant-Offline-RAG-Pipeline-"}, {"seq": 255, "name": "Ashprogrammer29/MyOwnLLM-Enterprise-Grade-Local-RAG-Platform", "type": "GitHub仓库", "importance": "D", "stars": "", "forks": "", "category": "AI信息泄漏", "desc": "MyOwnLLM 是一个容器化的本地 RAG 生态系统，利用 FastAPI 和 Qdrant 提供安全的多租户文档智能。它通过完全在本地硬件上处理高维向量嵌入和 Llama 3 推理来消除数据泄漏，通过 JWT 保护、用户隔离的检索管道确保 100% 隐私", "url": "https://github.com/Ashprogrammer29/MyOwnLLM-Enterprise-Grade-Local-RAG-Platform"}, {"seq": 256, "name": "asrith4545/apolapragada1_CSC8930_MSCS_Capstone", "type": "GitHub仓库", "importance": "D", "stars": "", "forks": "1", "category": "AI信息泄漏", "desc": "该项目使用联邦学习和差分隐私来实现隐私保护入侵检测系统。为了保护敏感的网络数据，客户端在本地训练模型，同时DP防止信息泄露。该系统在 UNSW-NB15 数据集（IID/非 IID）上进行评估，平衡了检测准确性和稳健的数据隐私。", "url": "https://github.com/asrith4545/apolapragada1_CSC8930_MSCS_Capstone"}, {"seq": 257, "name": "TUSHAR91316/Konvert-Website", "type": "GitHub仓库", "importance": "D", "stars": "", "forks": "", "category": "AI信息泄漏", "desc": "Konvert 是一款注重隐私的移动应用程序，旨在弥合离线安全和基于云的功能之间的差距。与需要将敏感数据上传到未知服务器的传统网络转换器不同，Konvert 使用混合引擎。它完全在设备本地处理敏感文件（如图像），确保零数据泄漏", "url": "https://github.com/TUSHAR91316/Konvert-Website"}, {"seq": 258, "name": "venkatkoushik22/Secure-Local-RAG-Private-Document-Intelligence-Platform", "type": "GitHub仓库", "importance": "D", "stars": "", "forks": "", "category": "AI信息泄漏", "desc": "隐私第一的 RAG 平台，提供有关文档和代码的本地情报。该系统采用 Meta 的 Llama 3 和 ChromaDB 构建，完全在设备上执行语义搜索和技术分析，以确保零数据泄漏。具有持久矢量数据库和自定义管道，可处理 PDF 和 Python 代码库等多格式文件。", "url": "https://github.com/venkatko function normalizeText(value) {
  decoder.innerHTML = value == null ? "" : String(value);
  return decoder.value;
}
function h(value) {
  return normalizeText(value).replace(/[&<>"']/g, function(ch) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
  });
}
function jsArg(value) {
  return JSON.stringify(String(value == null ? "" : value))
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;");
}
function moduleClass(id) { return "mod-" + id; }
function moduleColor(id) { return MODULE_COLORS[id] || "#0f172a"; }
function moduleName(mod) { return normalizeText(mod.title).replace(new RegExp("^" + mod.id + "\\s*"), "").trim(); }
function parseNum(n) {
  if (n === null || n === undefined || n === "") return 0;
  var v = parseInt(String(n).replace(/,/g, ""), 10);
  return isNaN(v) ? 0 : v;
}
function fmtNum(n) {
  n = parseNum(n);
  if (!n) return "0";
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "w";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return String(n);
}
function pct(part, total) { return total ? Math.round(part / total * 1000) / 10 : 0; }
function truncateText(value, maxLen) {
  var text = normalizeText(value).trim();
  return text.length > maxLen ? text.slice(0, maxLen - 1) + "…" : text;
}
function importanceWeight(v) { return {S:5, A:4, B:3, C:2, D:1}[v] || 0; }
function safeUrl(value) {
  var raw = normalizeText(value).trim();
  if (!raw) return "";
  try {
    var url = new URL(raw, window.location.href);
    if (url.protocol === "http:" || url.protocol === "https:" || url.protocol === "mailto:") return url.href;
  } catch (e) {}
  return "";
}
function hostName(url) {
  if (!url) return "未提供 URL";
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return "外部资源"; }
}
function allItems() {
  var out = [];
  DATA.forEach(function(mod) { mod.items.forEach(function(it) { out.push({ mod: mod, item: it }); }); });
  return out;
}
function uniqueSorted(values) {
  var seen = {}, out = [];
  values.forEach(function(v) { v = normalizeText(v).trim(); if (v && !seen[v]) { seen[v] = true; out.push(v); } });
  return out.sort(function(a, b) { return a.localeCompare(b, "zh-CN"); });
}
function getStats() {
  var flat = allItems();
  var types = {}, cats = {}, imp = {}, github = 0, urls = 0;
  flat.forEach(function(row) {
    var it = row.item;
    if (it.type) types[normalizeText(it.type)] = true;
    if (it.category) cats[normalizeText(it.category)] = true;
    if (it.importance) imp[it.importance] = (imp[it.importance] || 0) + 1;
    if (it.type === "GitHub仓库") github++;
    if (safeUrl(it.url)) urls++;
  });
  return {
    total: flat.length,
    modules: DATA.length,
    types: Object.keys(types).length,
    categories: Object.keys(cats).length,
    github: github,
    urlRate: pct(urls, flat.length),
    imp: imp
  };
}
function moduleStats(mod) {
  var s = { total: mod.items.length, s: 0, a: 0, categories: {}, github: 0 };
  mod.items.forEach(function(it) {
    if (it.importance === "S") s.s++;
    if (it.importance === "A") s.a++;
    if (it.category) s.categories[normalizeText(it.category)] = true;
    if (it.type === "GitHub仓库") s.github++;
  });
  s.categoryCount = Object.keys(s.categories).length;
  return s;
}

}

function buildNav() {
  var html = '<div class="nav-section"><button class="nav-section-title" type="button" onclick="resetModuleOnly()"><span class="label"><span class="dot"></span><b>全局概览</b></span><span class="count">ALL</span></button></div>';
  DATA.forEach(function(mod, index) {
    var stats = moduleStats(mod);
    var cats = Object.keys(stats.categories).sort(function(a, b) { return a.localeCompare(b, "zh-CN"); });
    var open = index === 0 || state.module === mod.id;
    html += '<div class="nav-section ' + moduleClass(mod.id) + '">';
    html += '<button class="nav-section-title ' + moduleClass(mod.id) + (state.module === mod.id ? ' active' : '') + '" type="button" onclick="toggleNav(this)" data-mod="' + h(mod.id) + '">';
    html += '<span class="label"><span class="dot"></span><b>' + h(mod.id + ' ' + moduleName(mod)) + '</b></span>';
    html += '<span class="count">' + stats.total + '</span>';
    html += '</button>';
    html += '<div class="nav-categories ' + (open ? 'open' : '') + '" id="nav-' + h(mod.id) + '">';
    html += '<a class="nav-cat ' + (state.module === mod.id && !state.category ? 'active' : '') + '" href="#mod-' + h(mod.id) + '" onclick="scrollToMod(' + jsArg(mod.id) + '); return false;">全部资源<em>' + stats.total + '</em></a>';
    cats.forEach(function(c) {
      var count = mod.items.filter(function(it) { return normalizeText(it.category) === c; }).length;
      html += '<a class="nav-cat ' + (state.module === mod.id && state.category === c ? 'active' : '') + '" href="#mod-' + h(mod.id) + '" onclick="scrollToCat(' + jsArg(mod.id) + ',' + jsArg(c) + '); return false;">' + h(c) + '<em>' + count + '</em></a>';
    });
    html += '</div></div>';
  });
  document.getElementById("nav-sections").innerHTML = html;
}

function scrollToCat(id, cat) {

function filterByCat(modId, cat) { state.module = modId; state.category = cat; renderAll(); }

function handleSearch(value) { state.query = normalizeText(value).toLowerCase().trim(); renderAll(); }
function setImportanceFilter(value) { state.importance = value; renderAll(); }
function setTypeFilter(value) { state.type = value; renderAll(); }

  state = { module: null, category: null, importance: "", type: "", sort: "priority", query: "" };

function syncControls() {
  document.getElementById("importance-filter").value = state.importance;
  document.getElementById("type-filter").value = state.type;
  document.getElementById("sort-mode").value = state.sort;
}

function sortItems(items) {
  return items.slice().sort(function(a, b) {
    if (state.sort === "stars") return parseNum(b.stars) - parseNum(a.stars) || importanceWeight(b.importance) - importanceWeight(a.importance) || parseNum(a.seq) - parseNum(b.seq);
    if (state.sort === "seq") return parseNum(a.seq) - parseNum(b.seq);
    if (state.sort === "name") return normalizeText(a.name).localeCompare(normalizeText(b.name), "zh-CN");
    return importanceWeight(b.importance) - importanceWeight(a.importance) || parseNum(b.stars) - parseNum(a.stars) || parseNum(a.seq) - parseNum(b.seq);
  });
}
function itemMatchesQuery(it, query) {
  if (!query) return true;
  var fields = [it.name, it.desc, it.category, it.type, it.importance, it.url].map(normalizeText).join(" ").toLowerCase();
  return fields.indexOf(query) >= 0;
}
function getFilteredItems(mod) {
  if (state.module && state.module !== mod.id) return [];
  var items = mod.items.slice();
  if (state.category && state.module === mod.id) items = items.filter(function(it) { return normalizeText(it.category) === state.category; });
  if (state.importance) items = items.filter(function(it) { return it.importance === state.importance; });
  if (state.type) items = items.filter(function(it) { return normalizeText(it.type) === state.type; });
  if (state.query) items = items.filter(function(it) { return itemMatchesQuery(it, state.query); });
  return sortItems(items);
}

  html += '</div>';

  html += '<div class="dashboard-grid">';
  html += '<div class="panel"><div class="panel-header"><div><h2>AI安全六大模块分布</h2><p>参考工作簿的 M1-M6 彩色模块体系</p></div><strong>' + stats.modules + ' 个模块</strong></div><div class="module-distribution">';
  DATA.forEach(function(mod) {
    var ms = moduleStats(mod);
    var rate = pct(ms.total, stats.total);
    html += '<div class="dist-row ' + moduleClass(mod.id) + '" style="--pct:' + rate + '%">';
    html += '<div class="dist-name"><span class="dot"></span><span>' + h(moduleName(mod)) + '</span></div>';
    html += '<div class="dist-count">' + ms.total + '</div><div class="dist-rate">' + rate + '%</div><div class="bar-track"><div class="bar-fill"></div></div></div>';
  });
  html += '</div></div>';

  html += '<div class="panel"><div class="panel-header"><div><h2>重要性分级分布</h2><p>S/A/B/C/D 与参考表标准一致</p></div><strong>' + Object.keys(IMPORTANCE_LABELS).length + ' 档</strong></div><div class="importance-distribution">';
  ["S", "A", "B", "C", "D"].forEach(function(level) {
    var count = stats.imp[level] || 0;
    var rate = pct(count, stats.total);
    html += '<div class="dist-row importance-row" style="--pct:' + rate + '%; --grade-color:' + IMPORTANCE_COLORS[level] + '; --module-color:' + IMPORTANCE_COLORS[level] + '">';
    html += '<div class="dist-name"><span>' + h(IMPORTANCE_LABELS[level]) + '</span></div><div class="dist-count">' + count + '</div><div class="dist-rate">' + rate + '%</div><div class="bar-track"><div class="bar-fill"></div></div></div>';
  });
  html += '</div><div class="legend-note">S：' + h(IMPORTANCE_RULES.S) + '；A：' + h(IMPORTANCE_RULES.A) + '；B/C/D 依次为重要、参考、基础资源。</div></div>';
  html += '</div>';
  document.getElementById("dashboard").innerHTML = html;
}

function renderTags(mod) {
  var stats = moduleStats(mod);
  var cats = Object.keys(stats.categories).sort(function(a, b) { return a.localeCompare(b, "zh-CN"); });
  var html = '<div class="tags">';
  html += '<button class="tag ' + (state.module === mod.id && !state.category ? 'active' : '') + '" type="button" onclick="scrollToMod(' + jsArg(mod.id) + ')">全部 <span>' + mod.items.length + '</span></button>';
  cats.forEach(function(c) {
    var count = mod.items.filter(function(it) { return normalizeText(it.category) === c; }).length;
    html += '<button class="tag ' + (state.module === mod.id && state.category === c ? 'active' : '') + '" type="button" onclick="scrollToCat(' + jsArg(mod.id) + ',' + jsArg(c) + ')">' + h(c) + ' <span>' + count + '</span></button>';
  });
  html += '</div>';
  return html;
}
function renderBadges(it) {
  var html = "";
  if (it.importance) html += '<span class="badge badge-' + h(it.importance) + '">' + h(IMPORTANCE_LABELS[it.importance] || (it.importance + "级")) + '</span>';
  if (it.type) html += '<span class="badge badge-' + h(typeBadgeClass[it.type] || "") + '">' + h(it.type) + '</span>';
  if (it.category) html += '<span class="category-pill">' + h(it.category) + '</span>';
  return html;
}
function renderCard(mod, it) {
  var url = safeUrl(it.url);
  var title = h(truncateText(it.name, 86));
  var fullTitle = h(it.name);
  var domain = h(hostName(url));
  var stats = [];
  if (parseNum(it.stars)) stats.push('<span>⭐ ' + fmtNum(it.stars) + '</span>');
  if (parseNum(it.forks)) stats.push('<span>🍴 ' + fmtNum(it.forks) + '</span>');
  stats.push('<span>序号 #' + h(it.seq || "-") + '</span>');
  var html = '<article class="card ' + moduleClass(mod.id) + '">';
  html += '<div class="card-header"><div class="seq-badge">' + h(mod.id) + '</div><div class="card-title-wrap">';
  if (url) html += '<a class="card-title" href="' + h(url) + '" title="' + fullTitle + '" target="_blank" rel="noopener noreferrer"><span class="icon">' + typeIcon(it.type) + '</span>' + title + '</a>';
  else html += '<span class="card-title" title="' + fullTitle + '"><span class="icon">' + typeIcon(it.type) + '</span>' + title + '</span>';
  html += '<div class="card-meta">' + renderBadges(it) + '</div></div></div>';
  html += '<div class="card-stats">' + stats.join("") + '</div>';
  if (it.desc) html += '<p class="card-desc">' + h(it.desc) + '</p>';
  html += '<div class="card-footer"><span class="domain">' + domain + '</span>';
  if (url) html += '<a class="card-link" href="' + h(url) + '" target="_blank" rel="noopener noreferrer">访问 →</a>';
  html += '</div></article>';
  return html;
}

function renderAll() {
  var totalVisible = 0;
  var html = "";
  DATA.forEach(function(mod) {
    var items = getFilteredItems(mod);
    if (!items.length) return;
    var ms = moduleStats(mod);
    totalVisible += items.length;
    html += '<section class="section ' + moduleClass(mod.id) + '" id="mod-' + h(mod.id) + '">';
    html += '<div class="section-head"><div><div class="section-kicker">' + h(mod.id) + ' · ' + ms.categoryCount + ' 个细分分类</div><h2 class="section-title">' + h(moduleName(mod)) + '</h2><p class="section-desc">' + h(mod.subtitle) + '</p></div>';
    html += '<div class="section-count">' + items.length + '<span>当前显示 / 共 ' + ms.total + '</span></div></div>';
    html += renderTags(mod);
    html += '<div class="cards">' + items.map(function(it) { return renderCard(mod, it); }).join("") + '</div></section>';
  });
  if (!html) html = '<div class="no-results"><strong>未找到匹配资源</strong><br>请尝试更换关键词，或重置等级、类型、模块筛选。</div>';
  document.getElementById("content").innerHTML = html;
  document.getElementById("total-count") && (document.getElementById("total-count").textContent = totalVisible);
  document.getElementById("side-total").textContent = getStats().total;
  document.getElementById("side-modules").textContent = DATA.length;
  syncControls();
  buildNav();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "SELECT") {
    e.preventDefault();
    document.getElementById("search").focus();
  }
});

buildFilterOptions();
renderDashboard();
renderAll();
</script>
</body>
</html>
